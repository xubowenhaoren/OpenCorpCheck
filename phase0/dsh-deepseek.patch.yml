# Official-API rollback for the headless worker (OCC_LLM_PROVIDER=deepseek).
# Applied after phase0/dsh.patch.yml. The ACP sidebar never uses this file.

- id: agent-default-model
  config:
    provider: deepseek-official
    model: deepseek-flash

# Research runs at low reasoning. The shipped headless default is high, which
# produced ~22k output tokens per company on the first DeepSeek run. The
# reviewer overrides this to `high` in reviewer.patch.yml; the ACP sidebar has
# its own low setting in .dsh/acp.patch.yml. Schema: off | low | high | max.
- id: llm-deepseek
  config:
    reasoningEffort: low

- id: llm-pi-ai
  config: {}
