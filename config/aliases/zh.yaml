# Curated Chinese name aliases
#
# Hand-maintained names that research profiles and constituent snapshots do not
# reliably contain. Keys are tickers exactly as stored in `securities.ticker`
# (US uppercase; A/HK as the numeric code). Values are common Chinese names,
# including the legal-name spelling and the short everyday name.
#
# These are *aliases*, not canonical names: ingestion never overwrites
# `companies.display_name` from this file. `occ aliases sync` inserts the rows
# idempotently and (optionally) re-indexes the company points so hybrid search
# sees them too. Pinyin/initials aliases are derived automatically.

